<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rubín en Guadalajara</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7e8c6;
        color: #183653;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main { width: min(100%, 1000px); }

      .game-shell { position: relative; }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(23, 50, 74, 0.18);
        background: #75c8f3;
      }

      .game-over {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        border-radius: 20px;
        background: rgba(24, 43, 91, 0.78);
        color: #fff;
      }

      .game-over[hidden] { display: none; }
      .game-over h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 48px); }
      .game-over p { margin: 0 0 18px; }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        margin-top: 14px;
      }

      .hint {
        margin: 0;
        font-size: 14px;
      }

      .touch-controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      button {
        border: 0;
        border-radius: 999px;
        min-width: 44px;
        min-height: 44px;
        padding: 10px 16px;
        background: #174b88;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button:hover { background: #10396c; }
      button:focus-visible { outline: 3px solid #f3c64e; outline-offset: 3px; }
      .touch-controls button { font-size: 20px; padding: 6px 13px; }

      @media (max-width: 640px) {
        body { padding: 12px; }
        .controls { justify-content: center; }
        .hint { text-align: center; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="game-shell">
        <canvas id="game" width="960" height="540" tabindex="0" aria-label="Rubín en Guadalajara, juego de plataformas 2D infinito. Flechas para moverte y Tab para pausar."></canvas>
        <section id="game-over" class="game-over" hidden aria-live="assertive">
          <div>
            <h1>¡Rubín necesita recargar!</h1>
            <p id="final-score">Puntos: 0</p>
            <button id="restart" type="button">Jugar otra vez</button>
          </div>
        </section>
      </div>
      <div class="controls">
        <p class="hint">← → explorar · ↑ o Espacio saltar · ↓ agacharse · Tab pausa · M sonido</p>
        <div class="touch-controls" aria-label="Controles táctiles">
          <button type="button" data-key="ArrowLeft" aria-label="Izquierda">←</button>
          <button type="button" data-key="ArrowUp" aria-label="Saltar">↑</button>
          <button type="button" data-key="ArrowRight" aria-label="Derecha">→</button>
          <button id="toggle" type="button" aria-pressed="false">Pausar</button>
        </div>
      </div>
    </main>
    <script src="scene.js?v=rubin-guadalajara-2"></script>
  </body>
</html>
